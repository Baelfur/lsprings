<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lsprings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; width: 100%; background: #ddd; }
  .leaflet-popup-content { font: 14px/1.45 system-ui, sans-serif; max-width: 300px; }
  .leaflet-popup-content h3 { margin: 0 0 2px; font-size: 15px; }
  .leaflet-popup-content .sub { color: #555; font-size: 12px; margin-bottom: 8px; }
  .leaflet-popup-content dl { margin: 0 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .leaflet-popup-content dt { color: #555; }
  .leaflet-popup-content dd { margin: 0; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content .srcs { border-top: 1px solid #ddd; padding-top: 6px; font-size: 12px; }
  .leaflet-popup-content .srcs a { display: block; margin-bottom: 2px; }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 11px;
           font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .badge.reported  { background: #1b6b3a; color: #fff; }
  .badge.estimated { background: #b26a00; color: #fff; }
  .badge.developer { background: #1c5aa8; color: #fff; }
  .badge.pumpage   { background: #5b3d8f; color: #fff; }
  /* One label style; each modifier only sets its colour. The border and the
     tooltip arrow both take currentColor, so colour is stated once. */
  .map-label {
    font: 600 12px/1.3 system-ui, sans-serif;
    background: rgba(255,255,255,0.93);
    border: 1px solid currentColor;
    padding: 3px 6px; border-radius: 3px; box-shadow: none; white-space: nowrap;
  }
  /* Leaflet colours the arrow per direction; set both so a label can point
     either way. These come after leaflet.css, so they win on equal specificity. */
  .map-label::before { border-right-color: currentColor; border-left-color: currentColor; }
  .map-label.gw      { color: #4a2f78; border-style: dashed; }
  .map-label.subject { color: #123f75; }
  .map-label.site    { color: #7a2718; }
  .legend {
    background: rgba(255,255,255,0.94); padding: 8px 10px; border-radius: 4px;
    font: 12px/1.5 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .legend b { display: block; margin-bottom: 4px; font-size: 12px; }
  .legend i { width: 12px; height: 12px; display: inline-block;
              margin-right: 6px; vertical-align: -2px; border-radius: 50%; }
  .leaflet-control-layers { font: 12px/1.5 system-ui, sans-serif; }
  .leaflet-control-layers b { display: block; margin: 2px 0 4px; }
  .leaflet-control-layers-list i {
    width: 12px; height: 12px; display: inline-block;
    margin-right: 5px; vertical-align: -2px; border-radius: 2px; opacity: 0.75;
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [30.580360532644164, -97.83738257327695];
const MILE_IN_METERS = 1609.344;

// Midpoint of the developer's 8-9 AF/yr lagoon evaporation estimate. Every
// "vs lagoon" multiple on the map is measured against this one number.
const LAGOON_AF = 8.5;

// Small multiples keep a decimal - rounding 1.35x to "1x" reads as parity.
const vsLagoon = af => {
  const x = af / LAGOON_AF;
  return x < 10 ? x.toFixed(1) : Math.round(x).toLocaleString();
};

// points.json is committed data, but it is still text going into innerHTML:
// a stray < in a note would silently break the popup it lands in.
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

const map = L.map('map').setView(CENTER, 11);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Aquifer polygons are area washes: give them their own pane under the default
// overlay pane (400) so they sit below every ring, site and label.
map.createPane('aquifers').style.zIndex = 350;

// --- reference rings around CENTER ---------------------------------------
// Larger circle first so the darker 3 mi ring draws on top of it.
const fiveMile = L.circle(CENTER, {
  radius: 5 * MILE_IN_METERS,
  color: '#7fce8b', weight: 2, fillColor: '#7fce8b', fillOpacity: 0.18
}).bindPopup('5 mile radius');

const threeMile = L.circle(CENTER, {
  radius: 3 * MILE_IN_METERS,
  color: '#1b6b3a', weight: 2, fillColor: '#1b6b3a', fillOpacity: 0.25
}).bindPopup('3 mile radius');

// --- water use sites ------------------------------------------------------
const SITES = [
  {
    name: 'Texas Crushed Stone',
    sub: 'Georgetown Quarry &middot; TCEQ RN102016482',
    lat: 30.576111, lon: -97.696666,
    label: 'Texas Crushed Stone<br>438M gal/yr',
    quality: 'reported',
    rows: [
      ['Total', '1,343.5 acre-feet (2024)'],
      ['Gallons', '437,788,200/yr'],
      ['Per day', '~1.20 million gal'],
      ['Source', 'Groundwater, Edwards-BFZ Aquifer'],
      ['Wells', '1 reported (2024)'],
      ['2019', '1,106.82 AF &mdash; up 21% since']
    ],
    note: 'Single largest aggregate water user in Williamson County. The 2024 ' +
          'figure comes from the TWDB detailed groundwater pumpage report, which ' +
          'supersedes the 2019 mining-survey number shown earlier.',
    sources: [
      ['TWDB/TCEQ Aggregate Mining Water Use, App. III (Table 3-2)',
       'https://www.twdb.texas.gov/waterplanning/data/projections/MiningStudy/doc/Final%20TWDB%20Mining%20Water%20Use%20Appendix%20III%20Jun%2015%202022.PDF'],
      ['TWDB Mining Water Use, App. IV (county projections)',
       'https://www.twdb.texas.gov/waterplanning/data/projections/MiningStudy/doc/Final%20TWDB%20Mining%20Water%20Use%20Appendix%20IV%20Jun%2015%202022.PDF'],
      ['TWDB Detailed Groundwater Pumpage by County (2024)',
       'https://www3.twdb.texas.gov/apps/reports/WU_REP/SumFinal_CountyPumpage'],
      ['USGS water-use site 948491085135000',
       'https://waterdata.usgs.gov/monitoring-location/USGS-948491085135000/'],
      ['Texas Crushed Stone Co.', 'https://www.texascrushedstoneco.com/']
    ]
  },
  {
    name: 'Crystal Falls Golf Course',
    sub: '18-hole municipal course &middot; City of Leander',
    lat: 30.535165, lon: -97.883220,
    label: 'Crystal Falls<br>~59M gal/yr (est.)',
    quality: 'estimated',
    rows: [
      ['Total', '~180 acre-feet/yr (est.)'],
      ['Range', '150&ndash;250 AF (49&ndash;81M gal)'],
      ['Gallons', '~59 million/yr'],
      ['Per day', '~161,000 gal'],
      ['Source', 'Reclaimed water (treated effluent)'],
      ['', 'Travisso Water Reclamation Plant']
    ],
    note: 'City-owned and operated. Leander states treated Travisso effluent irrigates ' +
          '&ldquo;the community golf course&rdquo;; Crystal Falls is the city&rsquo;s only ' +
          'golf course, so that is an inference, not a named citation. Volume estimated from a ' +
          '155-acre course polygon (~100 ac irrigated turf) &times; ~1.8 AF/acre.',
    sources: [
      ['City of Leander &mdash; Water &amp; Wastewater (Travisso effluent reuse)',
       'https://www.leandertx.gov/506/Water-Wastewater'],
      ['City of Leander &mdash; Golf Course directory',
       'https://www.leandertx.gov/Directory.aspx?did=71'],
      ['GCSAA Water Use on U.S. Golf Courses, Phase III (2022)',
       'https://www.gcsaa.org/docs/default-source/environment/22_waterreport_web.pdf'],
      ['Course boundary: OSM relation/7363676',
       'https://www.openstreetmap.org/relation/7363676']
    ]
  },
  {
    name: 'Twin Creeks Country Club',
    sub: '18-hole private club &middot; Cedar Park',
    lat: 30.463224, lon: -97.856534,
    label: 'Twin Creeks<br>~62M gal/yr (est.)',
    quality: 'estimated',
    rows: [
      ['Total', '~189 acre-feet/yr (est.)'],
      ['Range', '158&ndash;262 AF (51&ndash;85M gal)'],
      ['Gallons', '~62 million/yr'],
      ['Per day', '~169,000 gal'],
      ['Source', 'Not documented']
    ],
    note: 'Neither the volume nor the source is published. Cedar Park reports only ' +
          '3 reclaimed-water customers and does not name them, so this course is ' +
          '<strong>not</strong> confirmed to use reclaimed water &mdash; unlike the other two. ' +
          'Volume estimated from a 247-acre polygon (~105 ac irrigated turf) &times; ~1.8 AF/acre.',
    sources: [
      ['City of Cedar Park &mdash; Water Conservation Plan (Art. 18.11)',
       'https://ecode360.com/38630314'],
      ['City of Cedar Park &mdash; Drought Contingency Plan (Art. 18.08)',
       'https://ecode360.com/38629879'],
      ['GCSAA Water Use on U.S. Golf Courses, Phase III (2022)',
       'https://www.gcsaa.org/docs/default-source/environment/22_waterreport_web.pdf'],
      ['Course boundary: OSM relation/3203627',
       'https://www.openstreetmap.org/relation/3203627']
    ]
  },
  {
    name: 'Cimarron Hills Golf &amp; CC',
    sub: '18-hole Nicklaus course &middot; Georgetown',
    lat: 30.648033, lon: -97.7896178,
    label: 'Cimarron Hills<br>~53M gal/yr (est.)',
    quality: 'estimated',
    rows: [
      ['Total', '~162 acre-feet/yr (est.)'],
      ['Range', '135&ndash;225 AF (44&ndash;73M gal)'],
      ['Gallons', '~53 million/yr'],
      ['Per day', '~145,000 gal'],
      ['Source', 'Reclaimed water (treated effluent)'],
      ['', 'City of Georgetown purple-pipe system']
    ],
    note: 'No facility-level figure is published. Estimated from a 131-acre ' +
          'course polygon (~90 ac irrigated turf) &times; ~1.8 AF/acre, derived from ' +
          'Central Texas ET and rainfall. The <em>source</em> is documented: all six ' +
          'Georgetown golf courses irrigate with reclaimed water, and the Cimarron ' +
          'Hills system was built by the developer.',
    sources: [
      ['City of Georgetown &mdash; Water Resources FAQ (reclaimed water)',
       'https://georgetowntexas.gov/utilities/water/resources/faqs/index.php'],
      ['GCSAA Water Use on U.S. Golf Courses, Phase III (2022)',
       'https://www.gcsaa.org/docs/default-source/environment/22_waterreport_web.pdf'],
      ['TWDB BMP 5.2 &mdash; Golf Course Conservation',
       'https://www.twdb.texas.gov/conservation/BMPs/Mun/doc/5.2.pdf'],
      ['Course boundary: OSM way/104049185',
       'https://www.openstreetmap.org/way/104049185']
    ]
  }
];

// --- the subject of the map: Leander Springs -------------------------------
// Sits at CENTER: the SW corner of US 183A and RM 2243, which is what the
// 3 and 5 mile rings are drawn from.
const leanderSprings = L.circleMarker(CENTER, {
  radius: 10, color: '#123f75', weight: 2,
  fillColor: '#2b7fd4', fillOpacity: 0.95
});

leanderSprings.bindTooltip('Leander Springs<br>~2.8M gal/yr (lagoon)', {
  permanent: true, direction: 'left', offset: [-14, 0], className: 'map-label subject'
});

leanderSprings.bindPopup(
  '<h3>Leander Springs</h3>' +
  '<div class="sub">77.9-acre mixed-use PUD &middot; 4-acre Crystal Lagoon</div>' +
  '<span class="badge developer">developer estimate</span>' +
  '<dl style="margin-top:8px">' +
    '<dt>Lagoon</dt><dd>8&ndash;9 acre-feet/yr (evaporation)</dd>' +
    '<dt>Gallons</dt><dd>~2.6&ndash;2.9 million/yr</dd>' +
    '<dt>Per day</dt><dd>~7,600 gal average</dd>' +
    '<dt>Source</dt><dd>On-site 800 ft well, Lower Trinity Aquifer</dd>' +
    '<dt>Backup</dt><dd>City of Leander, up to 200,000 gal/day,</dd>' +
    '<dt></dt><dd>Dec&ndash;Feb off-peak only</dd>' +
    '<dt>Loop</dt><dd>Closed, recycles 80&ndash;95%</dd>' +
  '</dl>' +
  '<div style="font-size:12px;color:#444;margin-bottom:8px">' +
    'The 8&ndash;9 AF figure is <strong>lagoon evaporation only</strong>, not the ' +
    'development&rsquo;s total water demand. It works out to ~25 in/yr over 4 acres, ' +
    'at or just below ordinary Central Texas net evaporation (~26&ndash;36 in/yr) ' +
    '&mdash; plausible, but not a conservative number. The city backup allowance ' +
    '(200,000 gal/day for ~90 days = ~55 AF) is ~6&times; the claimed annual loss.' +
  '</div>' +
  '<div class="srcs"><strong>Sources</strong><br>' +
    '<a href="https://communityimpact.com/austin/leander-liberty-hill/development/2026/06/29/lagoon-anchored-leander-springs-development-advances-to-leander-city-council/" target="_blank" rel="noopener">Community Impact &mdash; P&amp;Z approval, Jun 2026 (8&ndash;9 AF, Lower Trinity well)</a>' +
    '<a href="https://communityimpact.com/austin/cedar-park-leander/development/2021/01/22/council-oks-1b-leander-springs-development-addresses-water-concerns-in-agreement/" target="_blank" rel="noopener">Community Impact &mdash; council water agreement, Jan 2021 (200,000 gal/day backup)</a>' +
    '<a href="https://www.crystal-lagoons.com/leander-city-texas-reveals-4-acre-amenity-by-crystal-lagoons-to-anchor-1b-mixed-use-development/" target="_blank" rel="noopener">Crystal Lagoons &mdash; project announcement</a>' +
    '<a href="https://leandersprings.us/" target="_blank" rel="noopener">leandersprings.us</a>' +
  '</div>',
  { maxWidth: 340 }
);

const markers = SITES.map(s => {
  const circle = L.circle([s.lat, s.lon], {
    radius: 0.5 * MILE_IN_METERS,
    color: '#7a2718', weight: 2, fillColor: '#d1502f', fillOpacity: 0.35
  });

  circle.bindTooltip(s.label, {
    permanent: true, direction: 'right', offset: [12, 0], className: 'map-label site'
  });

  const rows = s.rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('');
  const srcs = s.sources
    .map(([t, u]) => `<a href="${u}" target="_blank" rel="noopener">${t}</a>`)
    .join('');

  circle.bindPopup(
    `<h3>${s.name}</h3>` +
    `<div class="sub">${s.sub}</div>` +
    `<span class="badge ${s.quality}">${s.quality}</span>` +
    `<dl style="margin-top:8px">${rows}</dl>` +
    `<div style="font-size:12px;color:#444;margin-bottom:8px">${s.note}</div>` +
    `<div class="srcs"><strong>Sources</strong><br>${srcs}</div>`,
    { maxWidth: 320 }
  );

  return circle;
});


// --- verified groundwater withdrawals within ~15 mi -----------------------
// TWDB Water Use Survey, "Detailed Groundwater Pumpage by County", Williamson
// County, reporting year 2024. Self-reported by each entity to the state.
// Municipal rows are SYSTEM-WIDE totals across multiple well fields; the point
// is a representative location for the utility, NOT a single wellhead.
const GROUNDWATER = [
  { name: 'City of Georgetown', lat: 30.63266, lon: -97.67722, af: 8244,
    gal: '2,686,427,600', wells: 4, aq: 'Edwards-BFZ', system: true,
    label: 'Georgetown (municipal)<br>2,686M gal/yr' },
  { name: 'City of Round Rock', lat: 30.50826, lon: -97.67891, af: 1450,
    gal: '472,448,000', wells: 3, aq: 'Edwards-BFZ', system: true,
    label: 'Round Rock (municipal)<br>472M gal/yr' },
  { name: 'City of Liberty Hill', lat: 30.66490, lon: -97.92250, af: 188,
    gal: '61,359,184', wells: 4, aq: 'Trinity', system: true,
    label: 'Liberty Hill (municipal)<br>61M gal/yr &middot; Trinity' },
  { name: 'MM-North Austin Quarry', lat: 30.45500, lon: -97.79500, af: 74,
    gal: '24,083,600', wells: 1, aq: 'Edwards-BFZ', system: false,
    label: 'MM-North Austin Quarry<br>24M gal/yr' },
  { name: 'Brushy Creek MUD', lat: 30.51270, lon: -97.76140, af: 11.5,
    gal: '3,747,000', wells: 3, aq: 'Edwards-BFZ', system: true,
    label: 'Brushy Creek MUD<br>3.7M gal/yr' }
];

const gwMarkers = GROUNDWATER.map(g => {
  const c = L.circle([g.lat, g.lon], {
    radius: 0.5 * MILE_IN_METERS,
    color: '#4a2f78', weight: 2, dashArray: '5,4',
    fillColor: '#7d5bb5', fillOpacity: 0.25
  });

  c.bindTooltip(g.label, {
    permanent: true, direction: 'right', offset: [12, 0], className: 'map-label gw'
  });

  c.bindPopup(
    `<h3>${g.name}</h3>` +
    `<div class="sub">${g.system ? 'System-wide pumpage' : 'Single facility'} &middot; ${g.aq} Aquifer</div>` +
    '<span class="badge pumpage">reported pumpage</span>' +
    '<dl style="margin-top:8px">' +
      `<dt>2024</dt><dd>${g.af.toLocaleString()} acre-feet</dd>` +
      `<dt>Gallons</dt><dd>${g.gal}</dd>` +
      `<dt>Wells</dt><dd>${g.wells} reported</dd>` +
      `<dt>Aquifer</dt><dd>${g.aq}</dd>` +
      `<dt>vs lagoon</dt><dd>${vsLagoon(g.af)}&times; Leander Springs</dd>` +
    '</dl>' +
    '<div style="font-size:12px;color:#444;margin-bottom:8px">' +
      (g.system
        ? 'This is the utility&rsquo;s <strong>whole-system</strong> groundwater pumpage across ' +
          g.wells + ' wells, not one wellhead. The marker is a representative location for the ' +
          'service area, not a well site.'
        : 'Single reporting facility.') +
    '</div>' +
    '<div class="srcs"><strong>Source</strong><br>' +
      '<a href="https://www3.twdb.texas.gov/apps/reports/WU_REP/SumFinal_CountyPumpage" target="_blank" rel="noopener">TWDB Water Use Survey &mdash; Detailed Groundwater Pumpage by County (Williamson, 2024)</a>' +
      '<a href="https://www.twdb.texas.gov/waterplanning/waterusesurvey/historical-pumpage.asp" target="_blank" rel="noopener">TWDB Historical Groundwater Pumpage</a>' +
    '</div>',
    { maxWidth: 330 }
  );
  return c;
});

// --- toggleable groups ----------------------------------------------------
const ringsLayer   = L.layerGroup([fiveMile, threeMile]).addTo(map);
const subjectLayer = L.layerGroup([leanderSprings]).addTo(map);
const sitesLayer   = L.layerGroup(markers).addTo(map);
const pumpageLayer = L.layerGroup(gwMarkers).addTo(map);

const layerControl = L.control.layers(null, {
  'Leander Springs': subjectLayer,
  'Water use sites': sitesLayer,
  'Groundwater pumpage': pumpageLayer,
  '3 / 5 mile rings': ringsLayer
}, { collapsed: false, position: 'topright' }).addTo(map);

// --- aquifer extents ------------------------------------------------------
// aquifers.json is optional: absent, the map is exactly what it was. Build it
// from the TWDB Major Aquifers layer with scripts/build_aquifers.py.
// All aquifers start switched off - they are broad washes, and the map's
// argument is about the points on top of them.
fetch('aquifers.json')
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || !Array.isArray(data.aquifers) || !data.aquifers.length) return;
    // Count the feature rows before adding any aquifer, so the divider lands in
    // the right place even if a fifth group is added above.
    const list = document.querySelector('.leaflet-control-layers-overlays');
    const featureRows = list ? list.children.length : 0;
    data.aquifers.forEach(a => {
      const layer = L.geoJSON(a.geojson, {
        pane: 'aquifers',
        style: { color: a.color, weight: 1, opacity: 0.7,
                 fillColor: a.color, fillOpacity: 0.20 }
      });
      layer.bindPopup(
        `<h3>${esc(a.name)} Aquifer</h3>` +
        '<div class="sub">TWDB mapped extent &middot; clipped to this map</div>' +
        '<div style="font-size:12px;color:#444;margin:8px 0">' +
          'Full mapped extent, outcrop and downdip together &mdash; where the aquifer ' +
          'exists, not where it is being pumped. Outlines are simplified for display; ' +
          'use the TWDB source for anything that turns on an exact boundary.' +
        '</div>' +
        '<div class="srcs"><strong>Source</strong><br>' +
          '<a href="https://www.twdb.texas.gov/mapping/gisdata.asp" target="_blank" rel="noopener">TWDB &mdash; Major Aquifers GIS data</a>' +
        '</div>',
        { maxWidth: 300 }
      );
      layerControl.addOverlay(layer, `<i style="background:${a.color}"></i>${esc(a.name)}`);
    });
    if (list && featureRows) {
      list.children[featureRows - 1].insertAdjacentHTML('afterend', '<b>Aquifer extents</b>');
      list.insertAdjacentHTML('afterbegin', '<b>Map features</b>');
    }
  })
  .catch(err => console.error('failed to load aquifers.json', err));

// --- legend ---------------------------------------------------------------
const legend = L.control({ position: 'bottomleft' });
legend.onAdd = function () {
  const d = L.DomUtil.create('div', 'legend');
  d.innerHTML =
    '<b>Water use, acre-feet/yr</b>' +
    '<i style="background:#2b7fd4"></i>Leander Springs &mdash; developer est.<br>' +
    '<i style="background:#d1502f"></i>Reported / estimated user<br>' +
    '<i style="background:#7d5bb5;border:1px dashed #4a2f78"></i>Verified groundwater pumpage (2024)<br>' +
    '<i style="background:#7fce8b"></i>3 / 5 mile rings';
  return d;
};
legend.addTo(map);

// Frame the rings and every site together.
const extent = L.featureGroup([fiveMile, leanderSprings, ...markers, ...gwMarkers]).getBounds().pad(0.08);
map.fitBounds(extent);

// Leaflet caches the container size at init. If layout is still settling (web
// fonts, tab restore) it measures too small and tiles stop short of the edges.
// Re-measure and re-frame once the page is fully loaded.
window.addEventListener('load', () => {
  map.invalidateSize({ animate: false });
  map.fitBounds(extent);
});

// On resize, re-measure only. Re-framing here would discard whatever the user
// panned or zoomed to, and on mobile every URL-bar hide fires a resize.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => map.invalidateSize({ animate: false }), 150);
});

fetch('points.json')
  .then(r => r.ok ? r.json() : [])
  .then(points => {
    points.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(
      `<strong>${esc(p.name ?? '')}</strong>${p.note ? '<br>' + esc(p.note) : ''}`
    ));
  })
  .catch(err => console.error('failed to load points.json', err));
</script>
</body>
</html>
