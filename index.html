<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lsprings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; width: 100%; background: #ddd; }
  .leaflet-popup-content { font: 14px/1.4 system-ui, sans-serif; }
  .quarry-label {
    font: 600 12px/1 system-ui, sans-serif;
    background: rgba(255,255,255,0.92);
    border: 1px solid #7a2718;
    color: #7a2718;
    padding: 3px 6px;
    border-radius: 3px;
    box-shadow: none;
  }
  .quarry-label::before { border-right-color: #7a2718; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [30.580360532644164, -97.83738257327695];
const MILE_IN_METERS = 1609.344;

const map = L.map('map').setView(CENTER, 11);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Larger circle first so the darker 3 mi ring draws on top of it.
const fiveMile = L.circle(CENTER, {
  radius: 5 * MILE_IN_METERS,
  color: '#7fce8b',
  weight: 2,
  fillColor: '#7fce8b',
  fillOpacity: 0.18
}).addTo(map).bindPopup('5 mile radius');

const threeMile = L.circle(CENTER, {
  radius: 3 * MILE_IN_METERS,
  color: '#1b6b3a',
  weight: 2,
  fillColor: '#1b6b3a',
  fillOpacity: 0.25
}).addTo(map).bindPopup('3 mile radius');

// Texas Crushed Stone, Georgetown Quarry (TCEQ RN102016482).
// Coords and water use are from the TWDB/TCEQ aggregate mining water use
// survey, Appendix III, reporting year 2019.
const quarry = L.circleMarker([30.576111, -97.696666], {
  radius: 9,
  color: '#7a2718',
  weight: 2,
  fillColor: '#d1502f',
  fillOpacity: 0.9
}).addTo(map);

quarry.bindTooltip('Texas Crushed Stone &mdash; 361M gal/yr', {
  permanent: true,
  direction: 'right',
  offset: [10, 0],
  className: 'quarry-label'
});

quarry.bindPopup(
  '<strong>Texas Crushed Stone Co.</strong><br>' +
  'Georgetown Quarry (TCEQ RN102016482)<br><br>' +
  '<strong>2019 water use:</strong> 1,106.82 acre-feet<br>' +
  '&asymp; 361 million gallons/yr (~988,000 gal/day)<br><br>' +
  '<strong>Source:</strong> 99.9% groundwater (1,105.64 AF)<br>' +
  'Surface water: 1.17 AF (0.1%)<br><br>' +
  '<em>TWDB/TCEQ aggregate mining water use survey, 2019</em>'
);

// Frame the rings and the quarry together - the quarry sits ~8.4 mi east,
// outside the 5 mi ring, so fitting only the circles would push it off-screen.
map.fitBounds(L.featureGroup([fiveMile, quarry]).getBounds().pad(0.15));

fetch('points.json')
  .then(r => r.ok ? r.json() : [])
  .then(points => {
    points.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(
      `<strong>${p.name ?? ''}</strong>${p.note ? '<br>' + p.note : ''}`
    ));
  })
  .catch(err => console.error('failed to load points.json', err));
</script>
</body>
</html>
