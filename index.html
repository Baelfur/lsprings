<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lsprings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; width: 100%; background: #ddd; }
  .leaflet-popup-content { font: 14px/1.4 system-ui, sans-serif; }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([39.8, -98.6], 4);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

fetch('points.json')
  .then(r => r.ok ? r.json() : [])
  .then(points => {
    if (!points.length) return;
    const group = L.featureGroup(
      points.map(p => L.marker([p.lat, p.lon]).bindPopup(
        `<strong>${p.name ?? ''}</strong>${p.note ? '<br>' + p.note : ''}`
      ))
    ).addTo(map);
    map.fitBounds(group.getBounds().pad(0.2));
  })
  .catch(err => console.error('failed to load points.json', err));
</script>
</body>
</html>
