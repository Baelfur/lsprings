<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lsprings</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html, body { margin: 0; height: 100%; }
  #map { height: 100%; width: 100%; background: #ddd; }
  .leaflet-popup-content { font: 14px/1.45 system-ui, sans-serif; max-width: 300px; }
  .leaflet-popup-content h3 { margin: 0 0 2px; font-size: 15px; }
  .leaflet-popup-content .sub { color: #555; font-size: 12px; margin-bottom: 8px; }
  .leaflet-popup-content dl { margin: 0 0 8px; display: grid; grid-template-columns: auto 1fr; gap: 2px 10px; }
  .leaflet-popup-content dt { color: #555; }
  .leaflet-popup-content dd { margin: 0; font-variant-numeric: tabular-nums; }
  .leaflet-popup-content .srcs { border-top: 1px solid #ddd; padding-top: 6px; font-size: 12px; }
  .leaflet-popup-content .srcs a { display: block; margin-bottom: 2px; }
  /* Leaflet adds this class once a popup hits its maxHeight. Make it scroll
     like a native pane and stop the scroll chaining out to the map behind. */
  .leaflet-popup-scrolled {
    -webkit-overflow-scrolling: touch; overscroll-behavior: contain;
  }
  .badge { display: inline-block; padding: 1px 5px; border-radius: 3px; font-size: 11px;
           font-weight: 600; text-transform: uppercase; letter-spacing: .04em; }
  .badge.reported  { background: #1b6b3a; color: #fff; }
  .badge.estimated { background: #b26a00; color: #fff; }
  .badge.developer { background: #1c5aa8; color: #fff; }
  .badge.pumpage   { background: #5b3d8f; color: #fff; }
  /* One label style; each modifier only sets its colour. The border and the
     tooltip arrow both take currentColor, so colour is stated once. */
  .map-label {
    font: 600 12px/1.3 system-ui, sans-serif;
    background: rgba(255,255,255,0.93);
    border: 1px solid currentColor;
    padding: 3px 6px; border-radius: 3px; box-shadow: none; white-space: nowrap;
  }
  /* Leaflet colours the arrow per direction; set both so a label can point
     either way. These come after leaflet.css, so they win on equal specificity. */
  .map-label::before { border-right-color: currentColor; border-left-color: currentColor; }
  .map-label.gw      { color: #4a2f78; border-style: dashed; }
  .map-label.subject { color: #123f75; }
  .map-label.site    { color: #7a2718; }
  .scale-key {
    background: rgba(255,255,255,0.94); padding: 8px 10px; border-radius: 4px;
    font: 11px/1.35 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
    width: 268px;
  }
  .scale-key summary, .legend summary { cursor: pointer; list-style: none; }
  .scale-key summary::-webkit-details-marker,
  .legend summary::-webkit-details-marker { display: none; }
  .scale-key summary::after, .legend summary::after { content: ' ▴'; color: #888; }
  .scale-key details:not([open]) summary::after,
  .legend details:not([open]) summary::after { content: ' ▾'; }
  .scale-key b { display: inline; font-size: 12px; }
  .legend summary b { display: inline; margin: 0; }
  .card-short { display: none; }
  .scale-key .note { color: #666; margin-bottom: 6px; }
  .scale-key table { border-collapse: collapse; width: 100%; }
  .scale-key td { padding: 1px 0; vertical-align: middle; }
  .scale-key td.nm  { white-space: nowrap; padding-right: 6px; }
  .scale-key td.chip { width: 9px; padding-right: 5px; }
  .scale-key td.chip span { display: block; width: 9px; height: 9px; border-radius: 2px; }
  .scale-key .totals { margin-top: 6px; border-top: 1px solid #ddd; padding-top: 5px; }
  .scale-key .totals div { display: flex; align-items: center; gap: 5px; }
  .scale-key .totals i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .scale-key .totals .v { margin-left: auto; font-variant-numeric: tabular-nums; }
  .aq-btn {
    font: 600 12px/1 system-ui, sans-serif; cursor: pointer;
    padding: 7px 9px; margin: 8px 0; width: 100%;
    border: 1px solid var(--c); border-radius: 3px;
    background: #fff; color: var(--c); text-align: left;
  }
  .aq-btn::before {
    content: ''; display: inline-block; width: 9px; height: 9px; border-radius: 2px;
    background: var(--c); margin-right: 6px; vertical-align: -1px;
  }
  .aq-btn.on { background: var(--c); color: #fff; }
  .aq-btn.on::before { background: #fff; }
  .aq-btn:disabled { border-color: #ccc; color: #888; cursor: default; }
  .aq-btn:disabled::before { background: #ccc; }
  .aq-note { font-size: 12px; color: #555; margin: 8px 0; }
  .aq-note i { width: 9px; height: 9px; border-radius: 2px; display: inline-block;
               margin-right: 5px; vertical-align: -1px; }
  .scale-key td.af  { text-align: right; font-variant-numeric: tabular-nums;
                      padding-right: 5px; white-space: nowrap; }
  .scale-key td.x   { text-align: right; color: #666;
                      font-variant-numeric: tabular-nums; white-space: nowrap; }
  .scale-key td.bar { width: 100%; }
  .scale-key .track { background: #e8e8e8; border-radius: 2px; height: 8px; }
  .scale-key .fill  { height: 8px; border-radius: 2px; min-width: 2px; }
  .scale-key .subj  { font-weight: 700; }
  .scale-key .ref td.nm { color: #666; font-style: italic; }
  .scale-key .foot  { color: #666; margin-top: 6px; border-top: 1px solid #ddd;
                      padding-top: 5px; }
  .legend {
    background: rgba(255,255,255,0.94); padding: 8px 10px; border-radius: 4px;
    font: 12px/1.5 system-ui, sans-serif; box-shadow: 0 1px 4px rgba(0,0,0,.3);
  }
  .legend b { display: block; margin-bottom: 4px; font-size: 12px; }
  .legend i { width: 12px; height: 12px; display: inline-block;
              margin-right: 6px; vertical-align: -2px; border-radius: 50%; }
  .leaflet-control-layers { font: 12px/1.5 system-ui, sans-serif; }
  .leaflet-control-layers b { display: block; margin: 2px 0 4px; }
  .leaflet-control-layers-toggle { display: none; }
  .lc-details summary { cursor: pointer; list-style: none; padding: 1px 0 2px; }
  /* The control's own `b` rule is display:block for the section headings; the
     summary's title must stay inline or the caret drops to its own line. */
  .lc-details summary b { display: inline; margin: 0; }
  .lc-details summary::-webkit-details-marker { display: none; }
  .lc-details summary::after { content: ' ▴'; color: #888; }
  .lc-details:not([open]) summary::after { content: ' ▾'; }
  .lc-details .leaflet-control-layers-list { max-height: 60vh; overflow-y: auto; }
  .leaflet-control-layers-list i {
    width: 12px; height: 12px; display: inline-block;
    margin-right: 5px; vertical-align: -2px; border-radius: 2px; opacity: 0.75;
  }

  /* Narrow or short screens: the cards are 268px fixed, so two of them are
     wider than a phone and cover the map even collapsed. Here they shrink to
     their title bar, open on tap, and scroll inside a capped height. Keep this
     query in step with WIDE in the script. */
  @media (max-width: 799px), (max-height: 599px) {
    .card-full { display: none; }
    .card-short { display: inline; }
    .scale-key { width: auto; max-width: calc(100vw - 24px); }
    .legend { max-width: calc(100vw - 24px); }
    .scale-key summary, .legend summary { padding: 3px 0; }
    .scale-key details[open] {
      width: 258px; max-width: 100%;
      max-height: 42vh; overflow-y: auto; overscroll-behavior: contain;
    }
    .legend details[open] { max-height: 42vh; overflow-y: auto; overscroll-behavior: contain; }
    /* Keep the title visible while the body scrolls, so it stays closable. */
    .scale-key details[open] summary, .legend details[open] summary {
      position: sticky; top: 0; background: rgba(255,255,255,0.94);
    }
  }
</style>
</head>
<body>
<div id="map"></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const CENTER = [30.580360532644164, -97.83738257327695];
const MILE_IN_METERS = 1609.344;

// The developer's own 9,072 gal/day for the lagoon, in acre-feet. Every "vs
// lagoon" multiple on the map is measured against this one number. Their FAQ
// supersedes the 8-9 AF/yr evaporation figure that news coverage reported.
const LAGOON_AF = 10.16;

// Small multiples keep a decimal - rounding 1.35x to "1x" reads as parity.
const vsLagoon = af => {
  const x = af / LAGOON_AF;
  return x < 10 ? x.toFixed(1) : Math.round(x).toLocaleString();
};

// points.json is committed data, but it is still text going into innerHTML:
// a stray < in a note would silently break the popup it lands in.
const esc = s => String(s).replace(/[&<>"']/g,
  c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

// The keys are wide cards. On a phone an open one buries the map, so below this
// breakpoint each starts collapsed to its title bar and opens on tap, and the
// layer control uses Leaflet's own collapsed mode. Must match the media query
// in the stylesheet.
const WIDE = window.matchMedia('(min-width: 800px) and (min-height: 600px)');

const map = L.map('map').setView(CENTER, 11);

L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
}).addTo(map);

// Aquifer polygons are area washes: give them their own pane under the default
// overlay pane (400) so they sit below every ring, site and label.
map.createPane('aquifers').style.zIndex = 350;

// --- reference rings around CENTER ---------------------------------------
// The rings are context, not data. They get their own pane between the aquifer
// washes (350) and the default overlay pane (400), so every site circle and
// label draws on top of them and wins the click.
map.createPane('rings').style.zIndex = 375;

// Each ring is two paths. The filled wash is interactive:false, so the several
// square miles it covers never swallow a click or a hover meant for a site
// underneath. The outline is a thin stroke-only path that does take a hover, so
// the ring can still say what it is -- a hit area a couple of pixels wide,
// instead of the whole disc.
function ring(miles, color, fillOpacity) {
  const radius = miles * MILE_IN_METERS;
  const wash = L.circle(CENTER, {
    pane: 'rings', radius, stroke: false,
    fillColor: color, fillOpacity, interactive: false
  });
  const edge = L.circle(CENTER, {
    pane: 'rings', radius, color, weight: 2, fill: false
  }).bindTooltip(miles + ' mile radius', { sticky: true, direction: 'top' });
  return { wash, edge, paths: [wash, edge] };
}

// Larger ring first so the darker 3 mi wash lays over the 5 mi one.
const fiveMileRing  = ring(5, '#7fc9e8', 0.16);
const threeMileRing = ring(3, '#1f7fa8', 0.22);

// Kept for fitBounds, which only needs one shape's extent.
const fiveMile = fiveMileRing.wash;


// What actually supplies each user. This is the link the map was missing: the
// aquifer name lived in popup prose, so nothing on screen connected a well to
// the ground it draws from. Now it sets the ring around every site marker and a
// chip in the scale key, in the same hue as that aquifer's extent layer.
const SOURCE = {
  'edwards-bfz': { label: 'Edwards-BFZ',   color: '#2a7a9b' },
  'trinity':     { label: 'Trinity',       color: '#8a6d3b' },
  'reclaimed':   { label: 'Reclaimed',     color: '#3f8f63' },
  'city':        { label: 'City supply',   color: '#8a8f94' },
  'unknown':     { label: 'Not documented',color: '#c2c2c2' }
};
const srcOf = k => SOURCE[k] || SOURCE.unknown;



// TWDB's "non-surveyed estimate" rows: its own estimate of pumping by wells
// nobody meters -- domestic, livestock and small irrigation. Williamson County
// has no groundwater conservation district, so none of it is permitted either.
// County-wide totals, 2024, in acre-feet.
const PRIVATE_WELLS = {
  'trinity':        { af: 426, gal: '138,699,194' },
  'edwards-bfz':    { af: 650, gal: '211,675,677' },
  'carrizo-wilcox': { af: 30,  gal: '9,854,908' }
};

// --- popup -> aquifer linkage ---------------------------------------------
// Registered as the aquifer layers are built, so a popup opened before
// aquifers.json lands still finds them later. Popup markup is a string, so the
// click is handled by delegation and the label is refreshed on popupopen --
// the button has to say "Hide" if the layer control already turned it on.
const aquiferLayers = {};
const GROUNDWATER_SOURCES = ['edwards-bfz', 'trinity', 'carrizo-wilcox'];

// Each user was point-tested against the polygons and sits in exactly one part
// of its own aquifer, so the button draws that part alone. Toggling outcrop and
// downdip together showed a shape the well is not in.
const partLayers = (k, part) => {
  const g = aquiferLayers[k] || {};
  return part ? (g[part] ? [g[part]] : []) : Object.values(g);
};
const aquiferShown = (k, part) => partLayers(k, part).some(l => map.hasLayer(l));

function toggleAquifer(k, part) {
  const layers = partLayers(k, part);
  if (!layers.length) return;
  const on = aquiferShown(k, part);
  layers.forEach(l => (on ? map.removeLayer(l) : map.addLayer(l)));
}

function refreshAqBtn(b) {
  const k = b.dataset.aquifer, part = b.dataset.part || '';
  if (!partLayers(k, part).length) {
    b.disabled = true;
    b.textContent = srcOf(k).label + ' \u2014 extent not loaded';
    return;
  }
  const on = aquiferShown(k, part);
  b.disabled = false;
  b.classList.toggle('on', on);
  b.textContent = (on ? 'Hide ' : 'Show ') + srcOf(k).label +
                  (part ? ' ' + part : ' extent');
}

// One row per popup: what supplies this user, and for a groundwater source a
// button that draws that aquifer. Non-groundwater users get the chip only --
// there is no extent to show for reclaimed effluent or a city main.
function sourceControl(key, part) {
  const s = srcOf(key);
  if (!GROUNDWATER_SOURCES.includes(key)) {
    return `<div class="aq-note"><i style="background:${s.color}"></i>` +
           `Supplied by: ${esc(s.label)}</div>`;
  }
  return `<button class="aq-btn" data-aquifer="${esc(key)}" data-part="${esc(part || '')}" ` +
         `style="--c:${s.color}">Show ${esc(s.label)} ${esc(part || 'extent')}</button>`;
}

// A popup taller than the screen had nothing to scroll -- it simply ran off the
// bottom, and dragging inside it panned the map. Cap it against the current
// viewport and Leaflet's own scrolled-popup mode takes over. Measured on open,
// not at bind time, so it follows rotation and window size.
let openPopup = null;

function fitPopup(p) {
  if (!p) return;
  const el = p.getElement();
  if (!el) return;
  if (p._authoredMaxWidth === undefined) p._authoredMaxWidth = p.options.maxWidth;

  // maxWidth sizes the content, but what has to fit the screen is the whole
  // box. Measure the wrapper's padding and border rather than assume it.
  const content = el.querySelector('.leaflet-popup-content');
  const chrome = content ? Math.max(0, el.offsetWidth - content.offsetWidth) : 0;
  const size = map.getSize();

  // Leave a gutter for the zoom buttons: without it autoPan parks a
  // nearly-screen-wide popup at x=0 and they cover the first letter of the title.
  const gutter = WIDE.matches ? 24 : 76;
  const maxHeight = Math.max(140, Math.round(size.y * (WIDE.matches ? 0.75 : 0.6)));
  const maxWidth = Math.max(180, Math.min(p._authoredMaxWidth, size.x - gutter - chrome));

  p.options.autoPanPaddingTopLeft = L.point(WIDE.matches ? 12 : 54, 12);
  p.options.autoPanPaddingBottomRight = L.point(12, 12);
  if (p.options.maxHeight === maxHeight && p.options.maxWidth === maxWidth) return;
  p.options.maxHeight = maxHeight;
  p.options.maxWidth = maxWidth;
  p.update();
}

map.on('popupopen', e => {
  openPopup = e.popup;
  fitPopup(openPopup);
  const el = e.popup.getElement();
  if (el) el.querySelectorAll('.aq-btn').forEach(refreshAqBtn);
});
map.on('popupclose', () => { openPopup = null; });

document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('.aq-btn');
  if (!b || b.disabled) return;
  toggleAquifer(b.dataset.aquifer, b.dataset.part || '');
  refreshAqBtn(b);
});

// Keep every open button honest when the layer control is used instead.
map.on('overlayadd overlayremove', () => {
  document.querySelectorAll('.aq-btn').forEach(refreshAqBtn);
  decorateLayerList();
});

// --- water use sites ------------------------------------------------------
const SITES = [

    lat: 30.576111, lon: -97.696666,
    label: 'Texas Crushed Stone<br>438M gal/yr',
    quality: 'reported',
    rows: [

      ['Gallons', '437,788,200/yr'],

      ['TWDB Mining Water Use, App. IV (county projections)',
       'https://www.twdb.texas.gov/waterplanning/data/projections/MiningStudy/doc/Final%20TWDB%20Mining%20Water%20Use%20Appendix%20IV%20Jun%2015%202022.PDF'],
      ['TWDB Detailed Groundwater Pumpage by County (2024)',
       'https://www3.twdb.texas.gov/apps/reports/WU_REP/SumFinal_CountyPumpage'],
      ['USGS water-use site 948491085135000',
       'https://waterdata.usgs.gov/monitoring-location/USGS-948491085135000/'],
      ['Texas Crushed Stone Co.', 'https://www.texascrushedstoneco.com/']
    ]
  },
  {
    name: 'Crystal Falls Golf Course', short: 'Crystal Falls', src: 'reclaimed', af: 180,
    sub: '18-hole municipal course &middot; City of Leander',
    lat: 30.535165, lon: -97.883220,
    label: 'Crystal Falls<br>~59M gal/yr (est.)',
    quality: 'estimated',
    rows: [
      ['Total', '~180 acre-feet/yr (est.)'],
      ['Range', '150&ndash;250 AF (49&ndash;81M gal)'],

    ],

          'golf course, so that is an inference, not a named citation. Volume estimated from a ' +
          '155-acre course polygon (~100 ac irrigated turf) &times; ~1.8 AF/acre.',
    sources: [
      ['City of Leander &mdash; Water &amp; Wastewater (Travisso effluent reuse)',

       'https://www.leandertx.gov/Directory.aspx?did=71'],

    ]
  },

    label: 'Twin Creeks<br>~62M gal/yr (est.)',
    quality: 'estimated',
    rows: [
      ['Total', '~189 acre-feet/yr (est.)'],
      ['Range', '158&ndash;262 AF (51&ndash;85M gal)'],

    ],

    sources: [
      ['City of Cedar Park &mdash; Water Conservation Plan (Art. 18.11)',
       'https://ecode360.com/38630314'],

  {

    ],

      ['TWDB BMP 5.2 &mdash; Golf Course Conservation',
       'https://www.twdb.texas.gov/conservation/BMPs/Mun/doc/5.2.pdf'],

       'https://www.openstreetmap.org/way/104049185']

];

// --- the subject of the map: Leander Springs -------------------------------
// Sits at CENTER: the SW corner of US 183A and RM 2243, which is what the
// 3 and 5 mile rings are drawn from.
const leanderSprings = L.circleMarker(CENTER, {
  radius: 10, color: SOURCE.trinity.color, weight: 3.5,
  fillColor: '#2b7fd4', fillOpacity: 0.95
});

leanderSprings.bindTooltip('Leander Springs<br>~3.3M gal/yr (lagoon)', {
  permanent: true, direction: 'left', offset: [-14, 0], className: 'map-label subject'
});

leanderSprings.bindPopup(

// Leaflet rebuilds the overlay list's innerHTML on every layer add or remove,
// which throws away headings inserted into it -- so a popup's aquifer button
// silently stripped them. Re-apply after each rebuild instead of once, and
// clear first so an update Leaflet skipped cannot double them up.
function decorateLayerList() {
  const list = layerControl.getContainer()
    .querySelector('.leaflet-control-layers-overlays');
  if (!list) return;
  Array.from(list.children).forEach(el => { if (el.tagName === 'B') el.remove(); });
  const featureRows = Object.keys(FEATURE_OVERLAYS).length;
  if (list.children.length <= featureRows) return;   // aquifers not loaded yet
  list.children[featureRows - 1].insertAdjacentHTML('afterend', '<b>Aquifer extents</b>');
  list.insertAdjacentHTML('afterbegin', '<b>Map features</b>');
}

// --- aquifer extents ------------------------------------------------------
// aquifers.json is optional: absent, the map is exactly what it was. Build it
// from the TWDB Major Aquifers layer with scripts/build_aquifers.py.
// All aquifers start switched off - they are broad washes, and the map's
// argument is about the points on top of them.
fetch('aquifers.json')
  .then(r => r.ok ? r.json() : null)
  .then(data => {
    if (!data || !Array.isArray(data.aquifers) || !data.aquifers.length) return;
    data.aquifers.forEach(a => {
      // Outcrop reads as the solid one because it is the part at the surface.
      // Downdip is the same aquifer continuing underneath younger rock, so it
      // gets a fainter wash and a dashed edge -- present, but not competing.
      const base = a.key.replace(/-(outcrop|downdip)$/, '');
      const down = a.part === 'downdip';
      const shade = down ? lighten(a.color, 0.30) : a.color;
      const layer = L.geoJSON(a.geojson, {
        pane: 'aquifers',
        style: { color: down ? a.color : shade, weight: down ? 2 : 1,
                 opacity: 0.9, dashArray: down ? '6,4' : null,
                 fillColor: shade, fillOpacity: down ? 0.30 : 0.34 }
      });
      const priv = PRIVATE_WELLS[base];
      layer.bindPopup(
        `<h3>${esc(a.name)}</h3>` +
        `<div class="sub">TWDB mapped extent &middot; ${esc(a.part)} &middot; clipped to this map</div>` +
        '<div style="font-size:12px;color:#444;margin:8px 0">' +
          (a.part === 'outcrop'
            ? 'Where the aquifer reaches the <strong>surface</strong> &mdash; its recharge ' +
              'zone, and where shallower wells tap it.'
            : 'Where the aquifer continues in the <strong>subsurface</strong> beneath ' +
              'younger rock. Still pumped, but by deeper wells, and it underlies other ' +
              'aquifers mapped above it &mdash; so overlap here is real, not an error.') +
          ' This is where the aquifer exists, not where anyone is pumping it. Outlines ' +
          'are simplified for display; use the TWDB source for anything that turns on an ' +
          'exact boundary.' +
        '</div>' +
        (priv
          ? '<dl style="margin-bottom:8px">' +
              `<dt>Private wells</dt><dd>${priv.af.toLocaleString()} acre-feet/yr</dd>` +
              `<dt>Gallons</dt><dd>${priv.gal}</dd>` +
            '</dl>' +
            '<div style="font-size:12px;color:#444;margin-bottom:8px">' +
              'TWDB&rsquo;s estimate of pumping by <strong>unmetered</strong> domestic, ' +
              'livestock and small irrigation wells on this aquifer, county-wide. ' +
              'Williamson County has no groundwater conservation district, so none of it ' +
              'is permitted or measured &mdash; it is modelled, not counted.' +
            '</div>'
          : '') +
        '<div class="srcs"><strong>Source</strong><br>' +
          '<a href="https://www.twdb.texas.gov/mapping/gisdata.asp" target="_blank" rel="noopener">TWDB &mdash; Major Aquifers GIS data</a>' +
        '</div>',
        { maxWidth: 300 }
      );
      // Striping the downdip swatch says "same aquifer, buried" in a way two
      // flat blocks of one hue never did.
      const swatch = down
        ? `background:repeating-linear-gradient(45deg,${shade} 0 3px,#fff 3px 6px);` +
          `border:1px solid ${a.color}`
        : `background:${shade}`;
      (aquiferLayers[base] = aquiferLayers[base] || {})[a.part] = layer;
      layerControl.addOverlay(layer, `<i style="${swatch}"></i>${esc(a.name)}`);
    });
    decorateLayerList();
  })
  .catch(err => console.error('failed to load aquifers.json', err));



// Mix a hex colour toward white. Outcrop and downdip share a hue so the aquifer
// stays identifiable, but sharing a hue at two opacities made them impossible to
// tell apart -- especially in the layer control, where the swatches sit on white
// and both rendered as the same block. Lightening the actual colour separates
// them on the map and in the swatch.
function lighten(hex, amount) {
  const n = parseInt(hex.slice(1), 16);
  const mix = c => Math.round(c + (255 - c) * amount);
  const r = mix(n >> 16), g = mix((n >> 8) & 255), b = mix(n & 255);
  return `#${((r << 16) | (g << 8) | b).toString(16).padStart(6, '0')}`;
}

// --- scale key ------------------------------------------------------------
// Built from the same objects the map draws, so a figure can never be right in
// a popup and stale here. Rows span four orders of magnitude, so the bars are
// log-scaled -- labelled as such, because a log bar read as linear lies.
const SCALE_ROWS = [
  ...GROUNDWATER.map(g => ({ name: g.short, af: g.af, color: '#7d5bb5', src: g.src })),
  ...SITES.map(s => ({ name: s.short, af: s.af, color: '#d1502f', src: s.src })),
  // Not a map node: the development's own residential draw, implied by the
  // developer's "400 fewer units saves ~80,000 gal/day" (200 gal/day/unit).
  { name: 'LS apartments\u2020', af: 269, color: '#2b7fd4', src: 'city' },
  { name: 'LS lagoon', af: LAGOON_AF, color: '#2b7fd4', src: 'trinity', subject: true }
].sort((a, b) => b.af - a.af);

const scaleKey = L.control({ position: 'bottomleft' });
scaleKey.onAdd = function () {
  const d = L.DomUtil.create('div', 'scale-key');
  const hi = Math.max(...SCALE_ROWS.map(r => r.af));
  const lo = Math.min(...SCALE_ROWS.map(r => r.af)) * 0.7;
  const span = Math.log10(hi) - Math.log10(lo);
  const by = {};
  SCALE_ROWS.forEach(r => {
    const k = r.src || 'unknown';
    (by[k] = by[k] || { af: 0, n: 0 }).af += r.af;
    by[k].n += 1;
  });
  const totals = ['edwards-bfz', 'trinity', 'reclaimed', 'city', 'unknown']
    .filter(k => by[k])
    .map(k => `<div><i style="background:${srcOf(k).color}"></i>` +
              `${esc(srcOf(k).label)} <span style="color:#888">&times;${by[k].n}</span>` +
              `<span class="v">${Math.round(by[k].af).toLocaleString()}</span></div>`)
    .join('');

  const rows = SCALE_ROWS.map(r => {
    const pct = Math.max(2, ((Math.log10(r.af) - Math.log10(lo)) / span) * 100);
    const af = r.af >= 100 ? Math.round(r.af).toLocaleString()
             : Number.isInteger(r.af) ? String(r.af) : r.af.toFixed(1);
    return `<tr class="${r.subject ? 'subj' : ''}">` +
           `<td class="chip"><span style="background:${srcOf(r.src).color}"` +
             ` title="${esc(srcOf(r.src).label)}"></span></td>` +
           `<td class="nm">${esc(r.name)}</td>` +
           `<td class="af">${af}</td>` +
           `<td class="bar"><div class="track">` +
             `<div class="fill" style="width:${pct.toFixed(1)}%;background:${r.color}"></div>` +
           `</div></td>` +
           `<td class="x">${vsLagoon(r.af)}&times;</td></tr>`;
  }).join('');
  d.innerHTML =
    '<details><summary><b><span class="card-full">Scale &mdash; acre-feet per year</span>' +
    '<span class="card-short">Scale</span></b></summary>' +
    '<div class="note">bars log-scaled &middot; chip = what supplies it</div>' +
    `<table>${rows}</table>` +
    `<div class="totals">${totals}</div>` +
    '<div class="foot">1 gpm running year-round &asymp; 1.6 AF/yr<br>' +
    '1 AF = 325,851 gal &middot; &dagger; city water, developer-implied</div></details>';
  L.DomEvent.disableClickPropagation(d);
  return d;
};
scaleKey.addTo(map);


// --- gpm key --------------------------------------------------------------
// The developer quotes flow rates; every other source on this map reports
// annual volume. This ladder puts both on one axis, with household fixtures as
// rungs, so "20 gpm" can be sized against something familiar.
//
// Site rates are CONTINUOUS EQUIVALENT: the year's volume spread evenly across
// every minute of it. No real well runs that way -- they cycle -- so this is a
// like-for-like comparison, not a pump specification.
const AF_TO_GPM = 325851 / (365 * 24 * 60);
const gpmOf = af => af * AF_TO_GPM;
const gwAF = n => (GROUNDWATER.find(g => g.short === n) || {}).af;
const siteAF = n => (SITES.find(s => s.short === n) || {}).af;

const GPM_ROWS = [
  { name: 'Bathroom faucet',        gpm: 2.2,  ref: true },
  { name: 'Shower head',            gpm: 2.5,  ref: true },
  { name: 'LS lagoon, average',     gpm: gpmOf(LAGOON_AF), color: '#2b7fd4', subject: true },
  { name: 'Garden hose',            gpm: 10,   ref: true },
  { name: 'LS \u201c20 gpm\u201d figure',  gpm: 20, color: '#2b7fd4' },
  { name: 'MM-North Quarry',        gpm: gpmOf(gwAF('MM-North Quarry')), color: '#7d5bb5' },
  { name: 'LS 48-hour pump test',   gpm: 95,   color: '#2b7fd4' },
  { name: 'Cimarron Hills golf',    gpm: gpmOf(siteAF('Cimarron Hills')), color: '#d1502f' },
  { name: 'Fire hose, 1\u00be in line', gpm: 150, ref: true },
  { name: 'LS apartments',          gpm: gpmOf(269), color: '#2b7fd4' },
  { name: 'Texas Crushed Stone',    gpm: gpmOf(siteAF('Texas Crushed Stone')), color: '#d1502f' },
  { name: 'Fire hydrant',           gpm: 1000, ref: true },
  { name: 'Georgetown, city',       gpm: gpmOf(gwAF('Georgetown')), color: '#7d5bb5' }
].sort((a, b) => a.gpm - b.gpm);

const gpmKey = L.control({ position: 'bottomright' });
gpmKey.onAdd = function () {
  const d = L.DomUtil.create('div', 'scale-key');
  const hi = Math.max(...GPM_ROWS.map(r => r.gpm));
  const lo = Math.min(...GPM_ROWS.map(r => r.gpm)) * 0.7;
  const span = Math.log10(hi) - Math.log10(lo);
  const rows = GPM_ROWS.map(r => {
    const pct = Math.max(2, ((Math.log10(r.gpm) - Math.log10(lo)) / span) * 100);
    const n = r.gpm >= 100 ? Math.round(r.gpm).toLocaleString() : r.gpm.toFixed(1);
    return `<tr class="${r.ref ? 'ref' : ''} ${r.subject ? 'subj' : ''}">` +

             `<div class="fill" style="width:${pct.toFixed(1)}%;background:${r.color || '#b0b4b8'}"></div>` +
           `</div></td></tr>`;
  }).join('');
  d.innerHTML =
    '<details><summary><b><span class="card-full">Flow rate &mdash; gallons per minute</span>' +
    '<span class="card-short">Flow rate</span></b></summary>' +
    '<div class="note">bars log-scaled &middot; <i>italic</i> = everyday reference</div>' +

    'Fixture rates are typical; a hose varies 5&ndash;15 gpm with pressure.</div></details>';
  L.DomEvent.disableClickPropagation(d);
  return d;
};

  fitPopup(openPopup);
}
if (WIDE.addEventListener) WIDE.addEventListener('change', onBreakpoint);
else WIDE.addListener(onBreakpoint);           // Safari < 14

// On a small screen there is no room for two open cards, so they behave as an
// accordion. `toggle` does not bubble, hence the capture-phase listener.
document.addEventListener('toggle', ev => {
  const d = ev.target;
  if (!d.open || WIDE.matches || !d.closest) return;
  if (!d.closest('.scale-key, .legend, .leaflet-control-layers')) return;
  cards().forEach(o => { if (o !== d) o.open = false; });
}, true);

// Frame the rings and every site together.
const extent = L.featureGroup([fiveMile, leanderSprings, ...markers, ...gwMarkers]).getBounds().pad(0.08);
map.fitBounds(extent);

// Leaflet caches the container size at init. If layout is still settling (web
// fonts, tab restore) it measures too small and tiles stop short of the edges.
// Re-measure and re-frame once the page is fully loaded.
window.addEventListener('load', () => {
  map.invalidateSize({ animate: false });
  map.fitBounds(extent);
});

// On resize, re-measure only. Re-framing here would discard whatever the user
// panned or zoomed to, and on mobile every URL-bar hide fires a resize.
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    map.invalidateSize({ animate: false });
    fitPopup(openPopup);
  }, 150);
});

fetch('points.json')
  .then(r => r.ok ? r.json() : [])
  .then(points => {
    points.forEach(p => L.marker([p.lat, p.lon]).addTo(map).bindPopup(
      `<strong>${esc(p.name ?? '')}</strong>${p.note ? '<br>' + esc(p.note) : ''}`
    ));
  })
  .catch(err => console.error('failed to load points.json', err));
</script>
</body>
</html>
